name: Integration Tests

on:
    workflow_dispatch:
        inputs:
            runner:
                description: 'Runner environment to execute on'
                required: false
                default: 'self-hosted'
                type: choice
                options:
                    - self-hosted
                    - github-hosted
    # Master only, deliberately. This suite boots a full Hive stack on the
    # org's single self-hosted box and runs for the best part of an hour.
    # Per-pull-request runs spent that shared box on branches that get
    # force-pushed and rebased, while three other repos queued behind it.
    # Use workflow_dispatch to run it against a branch on purpose.
    push:
        branches: [master]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    hive-client-integration:
        name: HiveClient vs real Hive
        # The org is out of GitHub-hosted Actions minutes — everything runs on
        # the self-hosted pool.
        runs-on: ${{ (inputs.runner == 'github-hosted' || vars.CI_RUNNER == 'github-hosted') && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "dind"]') }}
        timeout-minutes: 45

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7


            # Shared org action: disk cleanup, boot + init, readiness check.
            # Same action Bluz/Peek-a-boo/Madash use for E2E.
            # image-source: registry pulls pyhive's nightly-built images
            # (ghcr.io/system-b90/hive/*) and reads docker-compose.yaml/.env
            # from pyhive's hive-stack/ directory — no Hive checkout. pyhive
            # is itself private, and GITHUB_TOKEN can't read across repos
            # even within the same org, so hive-token is still needed here
            # (just a much lower-privilege PAT than build mode's Hive-repo
            # clone would need). The action's own registry-prefix default
            # (ghcr.io/system-b15/hive) is stale post-rebrand, so it's pinned
            # here explicitly; registry-tag is left unset so it defaults to
            # the exact HIVE_SHA hive-stack/ recorded at publish time.
            - name: Set up Hive
              uses: System-B90/.github/actions/setup-hive@main
              with:
                  python-version: "3.13"
                  image-source: registry
                  registry-prefix: ghcr.io/system-b90/hive
                  hive-token: ${{ secrets.SYSTEM_B90_READ }}

            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: "22"

            - name: Install dependencies
              run: npm ci

            # Hive's nginx serves the sample self-signed cert setup-hive maps
            # to hive.org — same relaxation the other consumer repos' E2E
            # workflows use to talk to it.
            - name: Run integration tests against real Hive
              run: npm test
              env:
                  NODE_TLS_REJECT_UNAUTHORIZED: "0"
                  HIVE_TEST_URL: https://hive.org

            - name: Dump Hive container logs
              if: failure()
              run: |
                  mkdir -p container-logs
                  for c in $(docker ps -aq); do
                    name=$(docker inspect --format '{{.Name}}' "$c" | tr -d '/')
                    docker logs "$c" > "container-logs/$name.log" 2>&1 || true
                  done

            - name: Upload Hive container logs
              uses: actions/upload-artifact@v6
              if: failure()
              with:
                  name: hive-container-logs
                  path: container-logs/
                  retention-days: 7

            # ── Release the shared box ─────────────────────────────────────
            # Runs even when the tests fail: otherwise a dead Hive stack
            # occupies the shared runner until the next job happens to clear it
            # (System-B90/.github#12). Best-effort throughout — cleanup must not
            # turn a green run red.
            - name: Tear down Hive and reclaim disk
              if: always()
              run: |
                  # Best-effort: GitHub runs this under `bash -e`, where a bare
                  # command substitution from a dead docker daemon would abort the
                  # step before `exit 0`. Cleanup must never fail the job.
                  set +e
                  docker compose -f hive/docker-compose.yaml down -v --remove-orphans || true
                  leftovers=$(docker ps -aq --filter "name=^/hive-")
                  if [ -n "$leftovers" ]; then docker rm -f $leftovers || true; fi
                  docker container prune -f || true
                  docker volume prune -f || true
                  docker builder prune -f --keep-storage 10GB || true
                  df -h / || true
                  exit 0
