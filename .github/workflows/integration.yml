name: Integration Tests

on:
    workflow_dispatch:
    # Master only, deliberately: use workflow_dispatch to run it against a
    # branch on purpose. The Hive is shared with the other repos' E2E runs, so
    # per-pull-request runs on branches that get force-pushed and rebased would
    # just queue them behind us.
    push:
        branches: [master]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: read
    # shared-hive-acquire cancels this run if it holds Hive past 25 minutes.
    actions: write

jobs:
    hive-client-integration:
        name: HiveClient vs shared Hive
        # The persistent shared Hive lives on the shared-hive runners only
        # (mks90-laptop-wsl*); shared-hive-acquire fails anywhere else.
        runs-on: [self-hosted, shared-hive]
        # Queueing for the lock (up to 40m) + the 25m Hive budget.
        timeout-minutes: 75

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            # Everything slow happens before taking the shared Hive.
            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: "22"

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            # Exclusive, reset to baseline, 25-minute budget. Nothing is booted
            # per run, so this replaces setup-hive and the manual teardown.
            - name: Acquire shared Hive
              uses: System-B90/.github/actions/shared-hive-acquire@main

            # Hive's nginx serves a self-signed cert for hive.org. The baseline
            # superuser is admin/Password1, which is the tests' default login.
            # --ignore-scripts skips the pretest rebuild: Build already ran.
            - name: Run integration tests against shared Hive
              run: npm run test --ignore-scripts
              env:
                  NODE_TLS_REJECT_UNAUTHORIZED: "0"
                  HIVE_TEST_URL: https://hive.org

            - name: Release shared Hive
              if: always()
              uses: System-B90/.github/actions/shared-hive-release@main
