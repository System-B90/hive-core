name: Lint

on:
    workflow_dispatch:
    pull_request:
        branches: [master]
    push:
        branches: [master]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: ESLint + typecheck
        # GitHub-hosted: this repo is public, so hosted minutes are free, and the
        # self-hosted pool has not taken a job since 2026-09-19 (System-B90/.github#30).
        # Only jobs that need Docker-in-Docker stay on [self-hosted, dind].
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v6
              with:
                  node-version: "22"

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npx tsc -p tsconfig.json --noEmit
